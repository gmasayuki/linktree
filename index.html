<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css" >

    <title>Projeto Link Tree</title>
</head>
<body>

    <h1 class="titulo">Projeto Link Tree</h1>

    <section>
        <div class="foto-perfil">
            <img src="imagens/foto-perfil.webp" alt="Foto de perfil">
        </div>
    </section>

    <section class="comum">
        <a href="https://www.instagram.com/g.masayuki.t?stkn=ZTd1ZXp3YTcyYmxn" target="_blank" class="link">
            <div class="comum">
                <img src="icones/instagram.png" alt="Instagram">
                <span>Instagram</span>
            </div>
        </a>
    </section>

    <section class="comum2">
        <a href="https://discord.gg/tHtAfxcgHz" target="_blank" class="link">
            <div class="comum2">
                <img src="icones/discord.png" alt="Discord">
                <span>Discord</span>
            </div>
        </a>
    </section>

    <section class="raro">
        <a href="https://open.spotify.com/user/31gxnljhqtwof4gvhea4u2x54qai?si=K8-RkvoqSxqVkAOhDC27mw&utm_source=copy-link" target="_blank" class="link">
            <div class="raro">
                <img src="icones/spotify.png" alt="Spotify">
                <span>Spotify</span>
            </div>
        </a>
    </section>

</body>
</html>
